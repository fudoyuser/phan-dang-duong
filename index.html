<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phan Đăng Dương</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a2e;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .marquee-container {
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            font-size: 5rem;
            font-weight: 900;
            background: linear-gradient(90deg, #ff6ec4, #7873f5, #4adede, #ff6ec4);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: scroll-left 8s linear infinite, gradient-shift 3s ease infinite;
            filter: drop-shadow(0 0 20px rgba(120, 115, 245, 0.5));
        }

        @keyframes scroll-left {
            0% {
                transform: translateX(100vw);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        @keyframes gradient-shift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* Floating particles */
        .particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            animation: float-up linear infinite;
            opacity: 0.6;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="marquee-container">
        <span class="marquee-text">✨ Phan Đăng Dương ✨</span>
    </div>

    <script>
        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');

            const size = Math.random() * 8 + 3;
            const colors = ['#ff6ec4', '#7873f5', '#4adede', '#ffd700', '#ff4757'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.background = color;
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDuration = (Math.random() * 5 + 4) + 's';
            particle.style.animationDelay = (Math.random() * 3) + 's';

            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 10000);
        }

        setInterval(createParticle, 300);
        for (let i = 0; i < 15; i++) {
            setTimeout(createParticle, i * 100);
        }
    </script>
</body>
</html>
